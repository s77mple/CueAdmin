name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续 push 时，取消掉还在跑的旧任务，省时间也省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # .env 被 gitignore，CI 里不存在；而 storage/db.py 在 import 时就会
    # create_async_engine(settings.database_url)，空串会直接抛 ArgumentError。
    # 这里给一套假值即可 —— 测试本身用 SQLite 内存库 + fakeredis，
    # 这些只是让模块能正常 import（引擎是懒连接，不会真的去连 MySQL）。
    env:
      DATABASE_URL: mysql+aiomysql://root:password@127.0.0.1:3306/cueadmin_ci
      JWT_SECRET: ci-only-secret-not-used-in-production
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # ruff 版本与 .pre-commit-config.yaml 里的 rev 保持一致，
      # 否则会出现「本地过了 CI 不过」（或反之）的版本差异。
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.16.7

      - name: Lint（ruff check）
        run: ruff check .

      - name: 格式检查（ruff format）
        run: ruff format --check .

      # 测试用 SQLite 内存库 + fakeredis，不需要 MySQL / Redis 服务
      - name: 测试（pytest）
        run: pytest -q

  frontend:
    name: 前端 — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（vue-tsc）
        run: pnpm typecheck

      # lint:ci 是「只检查不修改」版本；
      # 本地 pnpm lint 带 --fix/--write，在 CI 里会自动修完然后通过，等于没检查。
      - name: Lint（只检查，不修改文件）
        run: pnpm lint:ci
