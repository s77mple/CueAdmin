<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通路1 · 批次链路推进（界面演示）</title>
<style>
:root{--primary:#409eff;--success:#67c23a;--warning:#e6a23c;--danger:#f56c6c;--info:#909399;
--text:#303133;--text2:#606266;--text3:#909399;--border:#ebeef5;--bd:#dcdfe6;--bg:#f0f2f5;
--sp:#ecf5ff;--spb:#b3d8ff;--spt:#409eff;--suc:#f0f9eb;--sucb:#b3e19d;--succt:#67c23a;
--warn:#fdf6ec;--warnb:#f5dab1;--warnt:#e6a23c;--info2:#f4f4f5;--info2b:#d3d4d6;--infot:#909399;
--dngr:#fef0f0;--dngrb:#fbc4c4;--dngrt:#f56c6c;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:210px;background:#001529;color:#bfcbd9;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:100}
.slogo{height:50px;display:flex;align-items:center;gap:9px;padding:0 18px;color:#fff;font-size:15px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06);flex:none}
.slogo .dot{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#36cfc9,#1890ff);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.slogo small{display:block;font-size:10px;font-weight:400;color:#5c6b7a}
.menu{flex:1;padding:6px 0;overflow:auto}
.menu::-webkit-scrollbar{width:0}
.mi{display:flex;align-items:center;gap:10px;height:46px;padding:0 20px;cursor:pointer;color:#bfcbd9;font-size:14px;user-select:none}
.mi svg{width:16px;height:16px;fill:#8a99ab;flex:none}
.mi:hover{background:#001c3d;color:#fff}
.mi.on{background:var(--primary);color:#fff}
.mi.on svg{fill:#fff}
.mi .mtag{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:9px;background:#16324f;color:#7f95ab}
.mi.on .mtag{background:rgba(255,255,255,.22);color:#fff}
.sfoot{margin:12px 14px;padding:10px 12px;border-radius:8px;background:#0c2a47;color:#7f95ab;font-size:11.5px;line-height:1.7;flex:none}
.sfoot b{color:var(--warning)}
.main{flex:1;margin-left:210px;display:flex;flex-direction:column;min-height:100vh;min-width:0}
.hd{height:50px;background:#fff;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:90}
.crumb{font-size:14px}.crumb .sep{margin:0 8px;color:#c0c4cc}.crumb .cur{color:#97a8be}
.hd .sp{flex:1}
.user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 9px;border-radius:6px;position:relative}
.user:hover{background:#f5f7fa}
.avatar{width:32px;height:32px;border-radius:50%;background:#409eff;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.avatar.green{background:#67c23a}.avatar.orange{background:#e6a23c}.avatar.purple{background:#8e44ad}
.user .un{font-size:13.5px;font-weight:500}.user .ud{font-size:11px;color:var(--text3)}
.user .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #909399;margin-left:4px}
.drop{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.1);min-width:236px;padding:6px 0;z-index:200;display:none}
.drop.show{display:block}
.di{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}
.di:hover{background:#f5f7fa}
.di .dn{font-size:13px}.di .dd{font-size:11.5px;color:var(--text3)}
.di .chk{margin-left:auto;color:var(--primary);visibility:hidden}
.di.on .chk{visibility:visible}
.content{flex:1;padding:16px;min-width:0}
.card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:16px}
.card+.card{margin-top:14px}
.cd-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cd-h h2{font-size:16px;font-weight:600}
.cd-h .sub{font-size:12px;color:#c0c4cc}
/* tag */
.tag{display:inline-block;padding:0 8px;height:22px;line-height:20px;border-radius:4px;font-size:12px;border:1px solid transparent;white-space:nowrap}
.t-sp{background:var(--sp);color:var(--spt);border-color:var(--spb)}
.t-suc{background:var(--suc);color:var(--succt);border-color:var(--sucb)}
.t-warn{background:var(--warn);color:var(--warnt);border-color:var(--warnb)}
.t-inf{background:var(--info2);color:var(--infot);border-color:var(--info2b)}
.t-dgr{background:var(--dngr);color:var(--dngrt);border-color:var(--dngrb)}
/* 按钮 */
.btn{height:32px;padding:0 15px;border-radius:4px;border:1px solid transparent;font-size:13px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:5px}
.btn:hover{opacity:.85}
.btn.plain{background:#fff;border-color:var(--bd);color:var(--text)}
.btn.plain:hover{color:var(--primary);border-color:var(--primary);opacity:1}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* 表格 */
input.in,select.in{height:32px;border:1px solid var(--bd);border-radius:4px;padding:0 10px;font-size:13px;color:var(--text);outline:none;background:#fff}
input.in:focus,select.in:focus{border-color:var(--primary)}
input.in[disabled]{background:#f5f7fa;color:var(--text3)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{background:#fafafa;color:var(--text3);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;white-space:nowrap}
.tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2)}
.tbl tbody tr:hover td{background:#f5f7fa}
.lk{color:var(--primary);cursor:pointer;background:none;border:none;padding:0;font-size:13px}
.lk:hover{text-decoration:underline}.lk.danger{color:var(--danger)}.lk.dis{color:#c0c4cc;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .right{margin-left:auto;display:flex;gap:8px}
.page{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:14px;font-size:13px;color:var(--text2)}
.page .pg{display:flex;gap:4px}
.pbtn{min-width:28px;height:28px;border:1px solid var(--bd);background:#fff;border-radius:4px;font-size:12px;color:var(--text2);padding:0 6px}
.pbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pbtn.dis{color:#c0c4cc;cursor:not-allowed}
.empty{padding:52px 0;text-align:center;color:var(--text3);font-size:13px}
.empty .eico{font-size:28px;margin-bottom:8px;opacity:.4}
/* 弹窗/消息 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.dlg{background:#fff;border-radius:6px;width:100%;max-width:780px;box-shadow:0 10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;max-height:82vh;animation:pop .15s ease}
@keyframes pop{from{transform:translateY(-8px);opacity:.5}to{opacity:1;transform:none}}
.dlg-hd{display:flex;align-items:center;padding:13px 20px;border-bottom:1px solid var(--border);font-size:15.5px;font-weight:600}
.dlg-hd .x{margin-left:auto;border:none;background:none;font-size:20px;color:#909399;cursor:pointer}
.dlg-bd{padding:16px 20px;overflow:auto;font-size:13px}
.dlg-ft{display:flex;justify-content:flex-end;gap:10px;padding:11px 20px;border-top:1px solid var(--border);background:#fafafa;border-radius:0 0 6px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.fld label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px}
.fld input.in,.fld select.in{width:100%}
.money-in{background:#f7f8fa!important;color:#f56c6c;font-weight:600}
.sec-t{font-size:13.5px;font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sec-t:first-of-type{margin-top:0}
.sec-t::before{content:"";width:3px;height:13px;background:var(--primary);border-radius:1px}
.msg{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:4px;padding:9px 16px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:999;display:flex;gap:8px;align-items:center}
.ro-note{background:var(--warn);border:1px solid var(--warnb);color:#b26e00;border-radius:4px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
/* 批次链路工作台 */
.ws-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ws-head h2{font-size:16px;font-weight:600}
.ws-head .sp{flex:1}
.demo-tools{display:flex;gap:8px;align-items:center}
.pb-wrap{height:6px;border-radius:3px;background:#eef1f6;overflow:hidden;margin:10px 0 4px}
.pb-fill{height:100%;background:linear-gradient(90deg,#67c23a,#409eff);border-radius:3px;transition:width .4s}
.pb-txt{font-size:12px;color:var(--text3)}
.step{display:flex;gap:13px;position:relative;padding:0 0 4px}
.step::before{content:"";position:absolute;left:15px;top:34px;bottom:6px;width:2px;background:#e6ebf0}
.step:last-child::before{display:none}
.sd{width:31px;height:31px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;z-index:1;border:2px solid #fff;box-shadow:0 0 0 2px #dcdfe6;background:#fff}
.sd.done{background:var(--success);box-shadow:0 0 0 2px var(--sucb)}
.sd.cur{background:var(--warning);box-shadow:0 0 0 2px var(--warnb);animation:pl 1.6s infinite}
.sd.wait{background:#f2f4f7;color:#b6bcc6;box-shadow:0 0 0 2px #e6e9ee}
@keyframes pl{0%,100%{box-shadow:0 0 0 2px var(--warnb)}50%{box-shadow:0 0 0 6px rgba(230,162,60,.25)}}
.sb{flex:1;padding:2px 0 14px;min-width:0}
.sb .sl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb .sl .t{font-size:13.5px;font-weight:500;color:var(--text)}
.sb .sub{font-size:12px;color:var(--text3);margin-top:2px}
.sb .chips{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.sb .act{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fafbfc;border-radius:14px;padding:3px 11px;font-size:12px;color:var(--text2)}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.av-mini{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;margin-right:4px}
.finish{background:linear-gradient(135deg,#064e3b,#0e9f6e);color:#fff;border-radius:10px;padding:16px 18px;margin-top:4px;font-size:13.5px}
.warn-line{background:var(--warn);border:1px solid var(--warnb);color:#b26e00;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:13px;line-height:1.7}
/* 批次看板 */
.bcard{border:1px solid var(--border);border-radius:8px;padding:15px 18px;margin-bottom:12px;background:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap;cursor:pointer;transition:border-color .2s,box-shadow .2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.bcard:hover{border-color:var(--primary);box-shadow:0 3px 12px rgba(64,158,255,.12)}
.bcard.closed{opacity:.72;filter:grayscale(.3)}
.bc-main{flex:1;min-width:280px}
.bc-l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bc-l1 .no{font-size:16px;font-weight:700;color:var(--text)}
.bc-route{font-size:12.5px;color:var(--text2);margin-top:3px}
.bc-route b{color:var(--text)}
.bc-next{font-size:12.5px;color:#5b6b80;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bc-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:210px}
.bc-right .pb-wrap{width:200px;margin:0}
/* 附件上传占位 */
.upz{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 2px;margin-top:2px;border-top:1px dashed #eef1f5}
.upc{display:flex;gap:6px;flex-wrap:wrap}
.up-chip{display:inline-flex;align-items:center;gap:4px;background:#f0f9eb;border:1px solid var(--sucb);color:#4a7c2f;border-radius:4px;padding:3px 9px;font-size:12px}
.up-chip .x{cursor:pointer;color:#67c23a;font-weight:700}
.piao{margin-top:10px;border:1px dashed #c6d4e3;border-radius:8px;padding:10px 12px;background:#fbfdff}
.piao .p-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#5b6b80;margin-bottom:2px;flex-wrap:wrap}
.piao .p-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:6px 0;font-size:12.5px}
.piao .p-row+.p-row{border-top:1px dashed #e8edf3}
.piao .p-c{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.demo-hint{border-left:3px solid #d9e7ff;background:#f7fbff;padding:8px 12px;font-size:12px;color:#5b6b80;margin-bottom:14px;border-radius:0 6px 6px 0;line-height:1.7}
</style>
</head>

 bd+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="tag t-sp">'+d.type+'</span>'+stTag(d.status)+(ed?'<span class="tag t-suc">我方可编辑</span>':'<span class="tag t-inf">只读</span>')+'<span style="margin-left:auto;color:#c0c4cc;font-size:12px">录于 '+d.date+'</span></div>';
 bd+='<div class="sec-t">主档</div><div class="grid2">'+f2('单据编号',d.no)+f2('批号',d.batch)+f2('采购方（买方）',d.buyer)+f2('供应商',d.seller)+f2('货物',d.goods)+f2('合同数量',num(d.qty)+' KG')+f2('含税单价',money(d.price)+' /KG')+f2('合同编号',d.cno)+f2('合同金额','<b style="color:#f56c6c">'+money(d.amount)+'</b>')+f2('收货',esc(d.recv||'—'))+'</div>';
 bd+='<div class="sec-t">票 / 款</div><div class="grid2">'+f2('已付',money(d.paid))+f2('未付（=金额−Σ已付，自动）',money(unpaid))+'</div>';
 if(d.ro)bd+='<div style="color:#c0c4cc;font-size:12px;margin-top:6px">备注：'+esc(d.ro)+'</div>';
 bd+='<div class="sec-t">同批质检结果（'+qr.length+'）</div>'+(qr.length?qr.map(function(q){return '<div style="display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:4px;padding:7px 10px;margin-bottom:6px;font-size:12.5px"><span class="tag t-warn">'+q.stage+'</span><div style="flex:1"><b>'+q.product+'</b> · '+q.subj+'<div style="color:#909399">'+q.result+'</div></div><span style="color:#c0c4cc">'+q.no+'</span></div>'}).join(''):'<div style="color:#c0c4cc;font-size:12px">该批号暂无可见质检。</div>');
 var ov=openDlg('<b>采购记录详情 · '+d.no+'</b>',bd,'<button class="btn plain" id="dC">关 闭</button>');ov.querySelector('#dC').onclick=function(){ov.remove()};ov.querySelector('.dlg').style.maxWidth='760px'}
function f2(k,v){return '<div class="fld"><label>'+k+'</label><div style="line-height:30px;padding:0 10px;background:#f7f8fa;border:1px solid #ebeef5;border-radius:4px;color:#303133">'+v+'</div></div>'}

/* ==================== 质检记录 ==================== */
function renderQuality(){var canEdit=cur.scope==='all'||cur.key==='lin';
 var list=qcArr().filter(function(q){return canEdit||qcVisible(q)});
 if(f.kw)list=list.filter(function(q){return (q.no+' '+q.product+' '+q.subj+' '+q.batch).indexOf(f.kw)>=0});
 var body='<div class="toolbar"><input class="in" style="width:210px" placeholder="单号 / 产品 / 主体 / 批号" id="qkw"><div class="right">'+(canEdit?'<button class="btn" id="qAdd">＋ 录入质检</button>':'')+'</div></div>'+
 '<div style="font-size:12px;color:#c0c4cc;margin:-4px 0 12px">质检只记环节 / 产品 / 含量等结果，不含金额；链路中的质检步骤也在这里汇总。</div>';
 body+='<table class="tbl"><thead><tr><th style="width:118px">单号</th><th>检验环节</th><th>产品 / 被检主体</th><th>结果</th><th>批号</th><th>检测人</th><th>日期</th></tr></thead><tbody>';
 if(!list.length)body+='<tr><td colspan="7"><div class="empty"><div class="eico">🧪</div>暂无质检记录</div></td></tr>';
 list.forEach(function(q){body+='<tr><td>'+q.no+'</td><td><span class="tag '+(q.stage==='采购检验'?'t-sp':'t-warn')+'">'+q.stage+'</span></td><td><b>'+q.product+'</b><div style="font-size:12px;color:#909399">'+q.subj+'</div></td><td>'+q.result+'</td><td><span class="tag t-inf">'+q.batch+'</span></td><td>'+q.by+'</td><td>'+q.date+'</td></tr>'});
 body+='</tbody></table><div class="page"><span>共 '+list.length+' 条</span></div>';
 $('#content').innerHTML='<div class="card">'+body+'</div>';
 var c=$('#content');c.querySelector('#qkw').value=f.kw;c.querySelector('#qkw').oninput=function(){f.kw=this.value;renderQuality()};
 var ab=c.querySelector('#qAdd');if(ab)ab.onclick=function(){qcAdd()}}
function qcAdd(){var foot='<button class="btn plain" id="dNo">取 消</button><button class="btn" id="dOk">保 存</button>';var ov=openDlg('<b>录入质检</b>','',foot);var bd=ov.querySelector('.dlg-bd');
 bd.innerHTML='<div class="grid2"><div class="fld"><label>检验环节</label><select class="in" id="a1"><option>采购检验</option><option>生产检验</option></select></div><div class="fld"><label>被检主体</label><select class="in" id="a2">'+Object.keys(SUBJ).filter(function(s){return s!=='farmer'&&s!=='kang'}).map(function(s){return '<option>'+SUBJ[s]+'</option>'}).join('')+'</select></div><div class="fld"><label>产品</label><input class="in" id="a3"></div><div class="fld"><label>批号</label><input class="in" id="a4"></div><div class="fld" style="grid-column:1/3"><label>含量结果</label><input class="in" id="a5"></div></div>';
 ov.querySelector('#dOk').onclick=function(){var g=function(i){return bd.querySelector(i).value};var subj=g('#a2');var slug=Object.keys(SUBJ).find(function(s){return SUBJ[s]===subj});QCS.push({key:uid(),no:'QC-'+Date.now().toString().slice(0,8),batch:g('#a4'),stage:g('#a1'),qs:slug||'',subj:subj,product:g('#a3'),result:g('#a5'),date:new Date().toISOString().slice(0,10),by:cur.name,note:''});ov.remove();renderQuality();toast('已保存')};
 ov.querySelector('#dNo').onclick=function(){ov.remove()}}

/* ==================== 主体档案 ==================== */
function renderSubjects(){var can=cur.scope==='all';
 var teamOf={'cnsm':'昌农团队','ke':'昌农团队','libo':'昌农团队 · 代管','gp':'GH/GP 团队','gh':'GH/GP 团队','farmer':'外部（不登录）','kang':'外部（不登录）'};
 var roleOf={'cnsm':'采购平台','ke':'转开票抬头','libo':'代工厂（代录）','gp':'买方（自产）','gh':'买方','farmer':'上游供应商','kang':'上游供应商'};
 var rows=Object.keys(SUBJ).map(function(s){return '<tr><td><b>'+SUBJ[s]+'</b></td><td>'+roleOf[s]+'</td><td>'+teamOf[s]+'</td><td>'+(s==='farmer'||s==='kang'?'<span class="tag t-inf">不登录</span>':'<span class="tag t-suc">内部账号</span>')+'</td></tr>'}).join('');
 $('#content').innerHTML='<div class="card"><div class="cd-h"><h2>主体档案</h2><span class="sub">谁录谁的采购 / 谁只读 —— 由“主体 + 所属团队 + 代管”决定；链路某步由哪队录，就看这步买方抬头归谁。</span></div><table class="tbl"><thead><tr><th>主体名称</th><th>业务角色</th><th>所属团队 / 代管</th><th style="width:110px">是否登录</th></tr></thead><tbody>'+rows+'</tbody></table>'+(can?'<div style="margin-top:12px"><button class="btn" onclick="toast(\'主体新建表单见 M1 实现；字段=名称/类型/所属团队/代管\')">＋ 新增主体</button></div>':'')+'</div>'}

/* 顶栏 */
var dopen=false;
$('#userBox').addEventListener('click',function(e){if(e.target.closest('.drop'))return;dopen=!dopen;$('#drop').classList.toggle('show',dopen)});
document.addEventListener('click',function(e){if(!e.target.closest('#userBox')){dopen=false;$('#drop').classList.remove('show')}});

render();
</script>
</body>
</html>
